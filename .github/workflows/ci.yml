name: Quality CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Code Quality and Tests
    runs-on: ubuntu-latest
    # Uma execução normal leva uns 2 min. Sem limite, um travamento só é
    # cancelado pelo GitHub depois de 6 h. Cabe as duas tentativas dos testes.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # versão fixa para o CI não quebrar quando sair um Flutter novo
          flutter-version: 3.47.1
          cache: true

      # o .env real não vai para o git; o modelo basta para analyze e test
      - name: Create .env from template
        run: cp .env.example .env

      - name: Install dependencies
        run: flutter pub get

      # O mocktail não gera código (os mocks são classes escritas à mão nos
      # testes). O build_runner serve ao Drift, cujos *.g.dart não vão para o git.
      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      # Às vezes o flutter_tester cai (segmentation fault) ao fechar um teste
      # com banco SQLite nativo enquanto a cobertura é coletada, e o
      # flutter test fica esperando para sempre. Se passar de 10 min (código
      # 124 do timeout), roda de novo uma vez; falha de teste não repete.
      - name: Run tests with coverage
        run: |
          timeout 10m flutter test --coverage && exit 0 || status=$?
          if [ "$status" -ne 124 ]; then exit "$status"; fi
          echo "::warning::flutter test travou; repetindo uma vez"
          timeout 10m flutter test --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn
