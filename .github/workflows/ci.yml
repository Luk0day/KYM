name: Quality CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Code Quality and Tests
    runs-on: ubuntu-latest
    # Uma execução normal leva uns 3 min. Sem limite, um travamento só é
    # cancelado pelo GitHub depois de 6 h. Cabe os testes e a cobertura.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # versão fixa para o CI não quebrar quando sair um Flutter novo
          flutter-version: 3.47.1
          cache: true

      # o .env real não vai para o git; o modelo basta para analyze e test
      - name: Create .env from template
        run: cp .env.example .env

      - name: Install dependencies
        run: flutter pub get

      # O mocktail não gera código (os mocks são classes escritas à mão nos
      # testes). O build_runner serve ao Drift, cujos *.g.dart não vão para o git.
      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      # Os testes decidem se o CI passa, e rodam sem cobertura: a coleta de
      # cobertura às vezes derruba o flutter_tester (segmentation fault) em
      # testes com SQLite nativo, e aí o flutter test fica esperando para
      # sempre, mesmo com todos os testes passando.
      - name: Run tests
        timeout-minutes: 10
        run: flutter test

      # A cobertura roda à parte e não reprova o CI: se o flutter_tester cair,
      # o relatório pode não sair, mas os testes já passaram no passo acima.
      - name: Collect coverage
        id: coverage
        continue-on-error: true
        timeout-minutes: 12
        run: timeout 10m flutter test --coverage

      - name: Warn when coverage is missing
        if: steps.coverage.outcome == 'failure'
        run: echo "::warning::A coleta de cobertura falhou ou travou; os testes passaram no passo Run tests."

      - name: Upload coverage report
        if: hashFiles('coverage/lcov.info') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn
